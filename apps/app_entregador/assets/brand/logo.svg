<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400">
  <!-- Variação 1: Fundo Branco (#FFFFFF) com texto em Azul-Escuro (#0B3B40) -->
  <rect width="360" height="400" rx="28" fill="#FFFFFF" />
  <g transform="translate(60, 24)">
    <!-- Sol amarelo-laranjado (#FF9F1C) no canto superior -->
    <circle cx="174" cy="58" r="30" fill="#FF9F1C" />
    <!-- Haste simples arredondada (#0B3B40) -->
    <line x1="115" y1="108" x2="131" y2="188" stroke="#0B3B40" stroke-width="9" stroke-linecap="round" />
    <!-- Faixa de areia bege (#EFE2C4) -->
    <rect x="44" y="178" width="152" height="28" rx="14" fill="#EFE2C4" stroke="#0B3B40" stroke-width="3.5" />
    <!-- Ponteira superior -->
    <circle cx="106" cy="44" r="5.5" fill="#0B3B40" />
    <!-- Guarda-sol estilizado com listras alternadas em vermelho (#EA1D2C) e branco (#FFFFFF) -->
    <g id="umbrella-canopy">
      <path d="M 106,46 C 88,52 64,74 42,126 C 40,131 43,138 48,138 C 55,138 64,136 70,131 C 78,88 95,58 106,46 Z" fill="#EA1D2C" />
      <path d="M 106,46 C 95,58 78,88 70,131 C 76,135 86,136 94,136 C 99,96 104,64 106,46 Z" fill="#FFFFFF" />
      <path d="M 106,46 C 104,64 99,96 94,136 C 104,136 122,134 134,130 C 128,90 118,62 106,46 Z" fill="#EA1D2C" />
      <path d="M 106,46 C 118,62 128,90 134,130 C 144,126 156,122 164,116 C 150,80 132,58 106,46 Z" fill="#FFFFFF" />
      <path d="M 106,46 C 132,58 150,80 164,116 C 172,110 184,102 188,96 C 188,94 186,90 182,82 C 166,60 140,48 106,46 Z" fill="#EA1D2C" />
      <path d="M 106,46 C 88,52 64,74 42,126 C 40,131 43,138 48,138 C 55,138 64,136 70,131 C 76,135 86,136 94,136 C 104,136 122,134 134,130 C 144,126 156,122 164,116 C 172,110 184,102 188,96 C 188,94 186,90 182,82 C 166,60 140,48 106,46 Z" fill="none" stroke="#0B3B40" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <text x="180" y="308" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#0B3B40" letter-spacing="-0.5">Pé na Areia</text>
  <text x="180" y="344" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0B3B40" letter-spacing="4">ENTREGA NA PRAIA</text>
</svg>

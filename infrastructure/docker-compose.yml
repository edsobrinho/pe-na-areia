name: pe-na-areia

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }\" | grep -q 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  cloudinary-mock:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./cloudinary-mock:/app:ro
      - cloudinary-data:/tmp/cloudinary-storage
    environment:
      PORT: "8099"
      PUBLIC_BASE_URL: "http://localhost:8099"
      STORAGE_DIR: "/tmp/cloudinary-storage"
    command: ["node", "server.mjs"]
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8099/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      cloudinary-mock:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pe_na_areia?replicaSet=rs0
      MONGODB_DATABASE: pe_na_areia
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-before-using-it-elsewhere}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-pe-na-areia-local}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-local-key-123456}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-local-secret-123456}
      CLOUDINARY_UPLOAD_PREFIX: ${CLOUDINARY_UPLOAD_PREFIX:-http://cloudinary-mock:8099}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"

volumes:
  mongodb-data:
    name: pe-na-areia-mongodb-data
  cloudinary-data:
    name: pe-na-areia-cloudinary-data

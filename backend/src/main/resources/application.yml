server:
  port: 8080

spring:
  application:
    name: pe-na-areia-backend

  # Java 21: usa virtual threads para o processamento bloqueante suportado pelo Spring.
  threads:
    virtual:
      enabled: true

  # Upload de fotos: limite de 5MB por arquivo (POST /uploads/location-photo)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # A URI local e substituida pelo endereco do servico MongoDB no Docker Compose.
  # Para outros ambientes, configure MONGODB_URI e MONGODB_DATABASE.
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pe_na_areia?replicaSet=rs0&directConnection=true}
      database: ${MONGODB_DATABASE:pe_na_areia}
      auto-index-creation: true

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

cloudinary:
  # Credenciais do upload de fotos (POST /uploads/location-photo e /uploads/menu-item-photo).
  # Em ambiente Docker local, CLOUDINARY_UPLOAD_PREFIX aponta para o container cloudinary-mock.
  cloud-name: ${CLOUDINARY_CLOUD_NAME:pe-na-areia-local}
  api-key: ${CLOUDINARY_API_KEY:local-key-123456}
  api-secret: ${CLOUDINARY_API_SECRET:local-secret-123456}
  upload-prefix: ${CLOUDINARY_UPLOAD_PREFIX:http://localhost:8099}

app:
  pix:
    webhook-token: ${PIX_WEBHOOK_TOKEN:${PIX_WEBHOOK_SECRET:dev-pix-webhook-token-secret-12345}}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  delivery:
    # Raio máximo (em metros) para aceitar a confirmação de entrega do entregador
    confirmation-radius-meters: 60

penaareia:
    jwt:
      # Use JWT_SECRET com pelo menos 32 caracteres em producao.
      secret: ${JWT_SECRET:troque-este-segredo-antes-de-ir-para-producao}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

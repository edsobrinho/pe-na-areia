name: pe_na_areia
description: App de entrega sustentavel para a orla de Santos
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Mapas e localizacao
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2

  # HTTP e estado
  http: ^1.2.1
  provider: ^6.1.2

  # Imagem (foto opcional do local)
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2

  # Notificacoes push (camada gratuita do Firebase)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
